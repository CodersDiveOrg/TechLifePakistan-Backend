# Nginx site for the Strapi backend — copy to /etc/nginx/sites-available/techlife-api
# Replace api.example.pk (twice), then:
#   ln -s /etc/nginx/sites-available/techlife-api /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.example.pk          # HTTPS

# Which client IP Strapi's rate limiter sees (it reads CF-Connecting-IP):
#  - requests from the storefront server may pass on the shopper's IP (the storefront sends it);
#  - everyone else gets their real address, so the header can't be faked.
# After the storefront's first build, find its server IP in /var/log/nginx/access.log, replace
# 127.0.0.1 below with it, and add the same IP to RATE_LIMIT_ALLOW_IPS in .env.
geo $from_storefront {
    default 0;
    127.0.0.1 1;   # ← storefront server IP
}
map "$from_storefront:$http_cf_connecting_ip" $rate_limit_ip {
    "~^1:(?<forwarded>.+)$" $forwarded;
    default                 $remote_addr;
}

server {
    listen 80;
    server_name api.example.pk;

    # Product images / manuals uploaded in the admin
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $rate_limit_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
